# TrainSync ML configuration. All tunables for the synthetic population
# (Phase 2) and, later, the clustering model (Phase 5).
# Documentation of every distribution and its source: ml/README.md.

synthetic:
  generator_version: synth-v1
  seed: 20260924
  n_trainees: 10000
  n_trainers: 1200
  email_domain: synthetic.trainsync.test
  locality_jitter_km: 1.2            # Gaussian sigma around the locality centroid
  noise_rate: [0.25, 0.35]           # per person; each attribute block is resampled from another archetype with this probability
  big5:
    candidates: 25                   # IPIP-FFM rows drawn per person
    beta: 1.5                        # softmax sharpness of the archetype tilt (0 = uniform empirical sampling)
  trainer:
    max_clients: [8, 25]
    price_inr_clip: [300, 2500]
    rating_beta: [8, 2]              # Beta(a, b) scaled to 1–5
    rating_count_lambda: 30          # Poisson
    home_gym_radius_km: 3
  diet_pref: {non-veg: 0.45, veg: 0.38, eggetarian: 0.10, jain: 0.04, vegan: 0.03}
  allergen_rates: {dairy: 0.05, shellfish: 0.03, gluten: 0.02, peanuts: 0.02, tree_nuts: 0.02, egg: 0.01, soy: 0.01, fish: 0.01, sesame: 0.005, mustard: 0.005}
  trainer_gender_pref: {female_prefers_female: 0.12, male_prefers_male: 0.03}
  search_radius_km: [4, 12]
  travel_radius_km: [3, 10]

  # Body measurements for urban Indian adults aged 18–55 (see ml/README.md).
  body:
    male:
      height_cm: [168.0, 6.8]        # mean, sd
      bmi_median: 23.3
      bmi_log_sd: 0.15
      waist: [27.0, 2.40, 3.2]       # waist = a + b·BMI + N(0, sd)
      neck: [23.0, 0.57, 1.0]
      hip: [55.0, 1.70, 3.0]
      navy_floor: 30                 # waist − neck ≥ 30 cm keeps Navy BF ≳ 6 %
      wrist: [16.8, 0.9]
    female:
      height_cm: [155.5, 6.2]
      bmi_median: 23.5
      bmi_log_sd: 0.16
      waist: [18.0, 2.45, 3.5]
      neck: [19.5, 0.50, 0.9]
      hip: [50.0, 1.90, 3.0]
      navy_floor: 110                # waist + hip − neck ≥ 110 cm keeps Navy BF ≳ 12 %
      wrist: [15.0, 0.8]
    bmi_clip: [16.0, 42.0]

  # Planted latent structure. Each archetype is a prior over the blocks that
  # later become matching features. goals/modality/schedule are independent
  # Bernoulli probabilities (multi-hot); style = [mean, sd] on a 1–5 scale;
  # budget/price = [median INR, lognormal sigma]; big5_tilt = direction used to
  # importance-sample real IPIP-FFM rows (keeps real trait correlations).
  archetypes:
    structured_strength_beginner:
      label: Structured Strength Beginner
      share: {trainee: 0.16, trainer: 0.15}
      trainee:
        goals: {strength: 0.8, beginner-onboarding: 0.8, muscle-gain: 0.35, general-fitness: 0.3}
        body_goal: {lean-bulk: 0.4, maintenance: 0.3, bulk: 0.2, cut: 0.1}
        experience: {beginner: 0.75, intermediate: 0.22, advanced: 0.03}
        style: {structure: [4.5, 0.6], tone: [2.6, 0.8], checkin: [3.8, 0.7], data: [3.8, 0.8]}
        modality: {in_person_gym: 0.9, home: 0.2, online: 0.15, outdoor: 0.1}
        schedule: {weekday_morning: 0.3, weekday_afternoon: 0.1, weekday_evening: 0.75, weekend_morning: 0.5, weekend_afternoon: 0.2, weekend_evening: 0.3}
        budget_inr: [700, 0.35]
        days_per_week: [3, 4]
        session_minutes: [45, 60]
        age: [19, 32]
        activity: {sedentary: 0.3, light: 0.4, moderate: 0.25, active: 0.05}
        bmi_shift: 0.0
        female_share: 0.35
        big5_tilt: {C: 0.8, O: 0.2}
      trainer:
        specializations: {strength: 0.9, beginner-onboarding: 0.85, muscle-gain: 0.5, general-fitness: 0.4}
        style: {structure: [4.6, 0.5], tone: [2.7, 0.8], checkin: [3.8, 0.7], data: [4.0, 0.7]}
        best_level: {beginner: 0.7, intermediate: 0.28, advanced: 0.02}
        modality: {in_person_gym: 0.95, home: 0.3, online: 0.25, outdoor: 0.1}
        schedule: {weekday_morning: 0.6, weekday_afternoon: 0.3, weekday_evening: 0.8, weekend_morning: 0.7, weekend_afternoon: 0.3, weekend_evening: 0.3}
        price_inr: [800, 0.30]
        years: [2, 9]
        certs: [ACE-CPT, NASM-CPT, K11-CPT, REPs India Level 3, Gold's Gym Fitness Institute]
        female_share: 0.25
        big5_tilt: {C: 0.8, A: 0.3}

