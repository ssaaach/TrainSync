<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Now</title>
    <link rel="icon" type="image/png" href="webicon1.png">
    <link rel="stylesheet" href="registration.css">
    <link rel="stylesheet" href="css/trainsync-ext.css">
</head>
<body>
    <div class="title"><h1>TrainSync</h1></div>
    <video autoplay muted loop id="bg-video">
        <source src="backgroundhome.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>
    <form id="registerForm">
        <div class="Registration">
            <h4>Create Account</h4>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required><br>
            
            <label for="username">Name</label>
            <input type="text" id="name" name="name" required><br>
            
            <label for="role">Role</label>
            <input type="text" id="role" name="role" required placeholder="trainer / trainee" list="role-options" autocomplete="off"><datalist id="role-options"><option value="trainer"><option value="trainee"></datalist><br>
            
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required><br>
            
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" required><br><br>
            
            <button type="submit">Create Account</button>
            <p id="errorMessage" style="color: rgb(211, 196, 196);"></p>
            <p>Already have an account? <a class="loginpagelink" href="login.html">Log In</a></p>
        </div>
    </form>
    <script src="js/common.js"></script>
    <script src="js/registration.js"></script>
</body>
</html>
