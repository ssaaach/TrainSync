<!DOCTYPE html>
<html lang="en" class="ts-no-js">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workout plans · TrainSync</title>
  <meta name="description" content="A periodised workout plan built around your goal, experience, equipment, schedule and injuries, with the reasoning shown for every choice.">
  <link rel="icon" type="image/png" href="/webicon1.png">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/onboarding.css">
  <link rel="stylesheet" href="/css/plans.css">
</head>
<body data-page="workoutplans">
  <a class="ts-skip" href="#main">Skip to content</a>
  <div class="ts-bg" aria-hidden="true"><img src="/media/smoke-wide.webp" alt=""></div>
  <header data-ts-nav></header>
  <main id="main" class="p-page">
    <div class="ts-container ts-container--wide">
      <header class="p-head">
        <p class="ts-eyebrow">Workout plans</p>

        <p class="p-head__sub" data-p-sub>Periodised plans from 870+ exercises, fitted to your goal, equipment, time and injuries.</p>

        <div class="p-actions" data-p-actions></div>
      </header>
      <div data-p-root><div class="ts-skeleton p-skel"></div></div>

  <dialog class="ts-sheet" data-p-sheet aria-labelledby="p-sheet-title">
    <div class="ts-sheet__grip" aria-hidden="true"></div>
    <button class="ts-icon-btn ts-icon-btn--sm ts-sheet__close" type="button" aria-label="Close" data-p-sheet-close>
      <svg class="ts-icon" aria-hidden="true"><use href="/icons.svg#i-close"></use></svg>

    <div class="ts-sheet__body" data-p-sheet-body></div>
  </dialog>

  <footer data-ts-footer></footer>
  <script src="/js/common.js"></script>
  <script src="/js/layout.js"></script>
