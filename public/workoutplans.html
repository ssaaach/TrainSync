<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout Plans</title>
    <link rel="icon" type="image/png" href="webicon1.png">
    <link rel="stylesheet" href="workoutplans.css">
    <link rel="stylesheet" href="css/trainsync-ext.css">
</head>
<body>
    <video autoplay muted loop id="bg-video">
        <source src="backgroundhome.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>
    <div class="title" id="trainsynctitle"><h1>TrainSync</h1></div>
    <form id="WorkoutsearchForm">
        <div class="SearchGym" id="searchBox">
            <h4>Personalised Workout Plan</h4>
            <label for="currentType">Current Body Type</label>
            <input type="text" id="currentType" name="currentType" placeholder="ectomorph || mesomorph || endomorph" required list="bodytype-options" autocomplete="off"><datalist id="bodytype-options"><option value="ectomorph"><option value="mesomorph"><option value="endomorph"></datalist><br>
            <label for="goalType">Goal</label>
            <input type="text" id="goalType" name="goalType" placeholder="cut || bulk || lean bulk || maintainance" list="goal-options" autocomplete="off"><datalist id="goal-options"><option value="cut"><option value="bulk"><option value="lean bulk"><option value="maintenance"></datalist><br><br>
            <button type="Search">Search</button>
            <p id="errorMessage" style="color: red;"></p>
            <p>New to TrainSync? <a class="registerpagelink" href="registration.html">Register</a></p>
        </div>
        <div id="dietResults" class="diet-results"></div>
    </form>

    <script src="js/common.js"></script>
    <script src="js/workoutplans.js"></script>
</body>
</html>
