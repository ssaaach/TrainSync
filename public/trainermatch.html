<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trainer Matching Demo</title>
  <link rel="stylesheet" href="trainermatch.css">
  <link rel="stylesheet" href="css/trainsync-ext.css">
  <link rel="icon" type="image/png" href="webicon1.png">
</head>
<body>
  <video autoplay muted loop id="bg-video">
    <source src="backgroundhome.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>
  <div class="title" id="trainsynctitle"><h1>TrainSync</h1></div>
  <div class="carousel-container">
    <div class="trainer-profile">
      <h2 id="trainer-name">Trainer Name</h2>
      <p id="trainer-specialty">Specialty</p>
      <p id="trainer-experience">Experience</p>
    </div>
    <div class="buttons">
      <button id="reject">Reject</button>
      <button id="match">Match</button>
    </div>
  </div>
  <script src="js/common.js"></script>
  <script src="js/trainermatch.js"></script>
</body>
</html>
